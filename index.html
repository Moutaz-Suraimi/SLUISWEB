<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SLUISWEB — Premium Web Development | Heemskerk Nederland</title>
    <meta
      name="description"
      content="SLUISWEB is een professioneel webbureau uit Nederland. Wij bouwen premium websites, webshops en webapplicaties voor ambitieuze bedrijven. Snel, veilig en volledig op maat. Vanaf €399."
    />
    <meta name="author" content="SLUISWEB Digital Agency" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sluisweb.nl/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sluisweb.nl/" />
    <meta property="og:site_name" content="SLUISWEB" />
    <meta property="og:title" content="SLUISWEB — Premium Web Development | Nederland" />
    <meta
      property="og:description"
      content="SLUISWEB bouwt premium websites, webshops en webapplicaties. Maatwerk, snel en meetbaar resultaat. Vanaf €399."
    />
    <meta property="og:image" content="https://sluisweb.nl/logo.png" />
    <meta property="og:locale" content="nl_NL" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sluisweb.nl/" />
    <meta name="twitter:title" content="SLUISWEB — Premium Web Development | Nederland" />
    <meta
      name="twitter:description"
      content="Professioneel webbureau uit Nederland. Websites, webshops en webapplicaties op maat. Snel, veilig en meetbaar."
    />
    <meta name="twitter:image" content="https://sluisweb.nl/logo.png" />

    <!-- Hreflang for NL & EN -->
    <link rel="alternate" hreflang="nl" href="https://sluisweb.nl/" />
    <link rel="alternate" hreflang="en" href="https://sluisweb.nl/en" />
    <link rel="alternate" hreflang="x-default" href="https://sluisweb.nl/" />

    <!-- Preconnect: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organization (JSON‑LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SLUISWEB",
        "url": "https://sluisweb.nl",
        "logo": "https://sluisweb.nl/logo.png",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+31-6-8468-3760",
          "contactType": "customer service",
          "availableLanguage": ["Dutch", "English"]
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Bartokstraat",
          "addressLocality": "Heemskerk",
          "addressCountry": "NL"
        },
        "sameAs": [
          "https://github.com/Moutaz-Suraimi/SLUISWEB",
          "https://wa.me/31684683760"
        ]
      }
    </script>

    <!-- Structured Data: WebSite + SiteLinks SearchBox (JSON‑LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SLUISWEB",
        "url": "https://sluisweb.nl",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sluisweb.nl/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'none';"
    />
  </head>

  <body>
    <!-- Root React Mount Point -->
    <div id="root"></div>

    <!-- Noscript Fallback -->
    <noscript>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #0f172a;
          color: #f8fafc;
          font-family: sans-serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <img src="/logo.png" alt="SLUISWEB" style="height: 64px; margin-bottom: 24px" />
        <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 12px">SLUISWEB</h1>
        <p style="color: #94a3b8; max-width: 480px">
          Om SLUISWEB te gebruiken, schakel JavaScript in uw browser in.<br />
          To use SLUISWEB, please enable JavaScript in your browser.
        </p>
        <a
          href="mailto:info@sluisweb.nl"
          style="
            margin-top: 24px;
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 12px 28px;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
          "
        >
          info@sluisweb.nl
        </a>
      </div>
    </noscript>

    <!-- App Entry Point (Vite injects the correct bundle path) -->
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
